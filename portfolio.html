<meta charset="utf-8">
<title>STRAITS — Portfolio</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#faf8f3; --ink:#161c33; --rule:rgba(22,28,51,.16); }
  *{box-sizing:border-box;}
  html,body{height:100%;height:100dvh;}
  body{margin:0;overflow:hidden;overscroll-behavior:none;touch-action:pan-y;
       -webkit-text-size-adjust:100%;background:var(--paper);color:var(--ink);
       font-family:'Space Mono',ui-monospace,monospace;-webkit-font-smoothing:antialiased;}
  main{max-width:960px;height:100%;margin:0 auto;
       padding:32px calc(32px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom))
               calc(32px + env(safe-area-inset-left));
       display:flex;flex-direction:column;justify-content:center;}

  .back{position:fixed;top:calc(26px + env(safe-area-inset-top));
        left:calc(32px + env(safe-area-inset-left));touch-action:manipulation;font-size:10px;letter-spacing:.2em;
        text-transform:uppercase;color:var(--ink);opacity:.45;text-decoration:none;}
  .back:hover{opacity:1;color:#e05c2b;}

  header img{height:38px;width:auto;display:block;}
  header p{margin:14px 0 0;max-width:46em;font-size:11px;line-height:1.7;opacity:.75;}

  ol{list-style:none;margin:34px 0 0;padding:0;border-top:1px solid var(--rule);}
  li{border-bottom:1px solid var(--rule);}
  .row{display:grid;grid-template-columns:22px 16px 1fr auto;gap:0 16px;align-items:baseline;
       padding:18px 4px;text-decoration:none;color:inherit;}
  a.row:hover{background:rgba(22,28,51,.035);}
  .num{font-size:10px;opacity:.35;font-variant-numeric:tabular-nums;}
  .chip{width:9px;height:9px;align-self:start;margin-top:4px;}
  .name{font-size:13px;font-weight:700;letter-spacing:.01em;}
  .what{margin:6px 0 0;font-size:11px;line-height:1.6;opacity:.7;max-width:52em;}
  .host{font-size:10px;letter-spacing:.08em;opacity:.45;white-space:nowrap;}
  a.row:hover .host{opacity:1;color:#e05c2b;}
  .host.none{opacity:.28;}

  /* Short windows and phones: the roster is taller than the screen, so let it
     scroll rather than clipping rows out of a centred, overflowing flex box. */
  @media (max-height:640px), (max-width:620px){
    html,body{height:auto;min-height:100%;}
    body{overflow:visible;}
    main{height:auto;justify-content:flex-start;}
  }
  @media (max-height:640px){
    main{padding-top:64px;padding-bottom:48px;}
  }
  @media (max-width:620px){
    main{padding:calc(64px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
                 calc(56px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));}
    header p{font-size:12px;}
    .row{grid-template-columns:20px 12px 1fr;gap:0 14px;padding:16px 2px;}
    .name{font-size:14px;}
    .what{font-size:12px;}
    .host{grid-column:3;padding-top:10px;}
  }
</style>

<main>
  <a class="back" href="index.html">&larr; Back</a>

  <header>
    <img src="straits-wordmark.png" alt="STRAITS" width="173" height="38">
    <p>Companies built and operated by Straits.</p>
  </header>

  <ol id="list"></ol>
</main>

<script>
/* iOS ignores user-scalable=no; block the pinch and keep the page steady. */
for (const g of ['gesturestart', 'gesturechange', 'gestureend'])
  addEventListener(g, e => e.preventDefault(), {passive:false});
addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});

/* Edit this list — the page renders straight from it. url is optional. */
const COMPANIES = [
  { name: 'Oppler',
    what: 'A filtered, citation-backed universe of institutional allocators — pensions, endowments, foundations, sovereign funds, family offices — for managers raising a fund.',
    url:  'https://oppler.ai' },

  { name: 'Alister Links',
    what: 'A directory of private golf clubs in the United States.',
    url:  'https://alisterlinks.com' },

  { name: 'Outguided',
    what: 'A marketplace for booking professionally guided outdoor trips.',
    url:  'https://outguided.com' },

  { name: 'Arbor Coach',
    what: 'A directory of credentialed coaches — compare ICF-certified executive, career, and business coaches by specialization and pricing.',
    url:  'https://arborcoach.com' },

  { name: 'Mico',
    what: 'Watches your Google reviews, drafts each reply in your own voice, and texts it to you to send.',
    url:  'https://mico.re' }
];

const CHIPS = ['#e05c2b', '#f0b03c', '#2f9e8f', '#2360a5', '#161c33', '#e8455f'];

const list = document.getElementById('list');
COMPANIES.forEach((c, i) => {
  const li = document.createElement('li');
  const tag = c.url ? 'a' : 'div';
  const row = document.createElement(tag);
  row.className = 'row';
  if (c.url){ row.href = c.url; row.rel = 'noopener'; }

  const host = c.url ? c.url.replace(/^https?:\/\//, '').replace(/\/$/, '') : 'in progress';

  row.innerHTML =
    '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
    '<span class="chip" style="background:' + CHIPS[i % CHIPS.length] + '"></span>' +
    '<span><span class="name"></span><p class="what"></p></span>' +
    '<span class="host' + (c.url ? '' : ' none') + '"></span>';
  row.querySelector('.name').textContent = c.name;
  row.querySelector('.what').textContent = c.what;
  row.querySelector('.host').textContent = host;

  li.appendChild(row);
  list.appendChild(li);
});
</script>
